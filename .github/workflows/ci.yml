name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Pruebas Python
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Mostrar versión de Python
        run: python --version

      - name: Instalar herramientas de prueba
        run: python -m pip install pytest

      - name: Instalar MeteoCam sin dependencias gráficas
        run: python -m pip install -e . --no-deps

      - name: Comprobar paquete MeteoCam
        run: |
          python -c "import meteocam; print('MeteoCam:', meteocam.__version__)"
          python -c "print('MeteoCam CI preparado correctamente')"

# Fin archivo: .github/workflows/ci.yml