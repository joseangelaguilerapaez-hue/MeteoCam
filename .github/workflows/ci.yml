name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Pruebas Python
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mostrar versión de Python
        run: python --version

      - name: Actualizar herramientas de instalación
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar MeteoCam y dependencias de desarrollo
        run: python -m pip install -e ".[dev]"

      - name: Comprobar PySide6
        run: |
          python -c "import PySide6; print('PySide6:', PySide6.__version__)"
          python -c "print('MeteoCam CI preparado correctamente')"

# Fin archivo: .github/workflows/ci.yml