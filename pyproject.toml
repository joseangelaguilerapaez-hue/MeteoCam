[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "meteocam"
version = "0.1.0"
description = "Agente de escritorio para gestión, monitorización, diagnóstico y control de cámaras IP de MeteoArchidona."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


# Fin archivo: pyproject.toml